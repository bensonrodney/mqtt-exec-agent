[project]
name = "mqtt-exec-agent"
version = "0.1.1"
description = "Runs a locally-configured command when triggered over MQTT, with Home Assistant MQTT-discovery built in"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mqtt_exec_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100
